{{- if .Values.tests.enabled }}
# `helm test {{ .Release.Name }}` runs this pod: it probes the Service's readiness
# and model endpoints. Non-zero exit fails the test. Hook-deleted after success.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "axiom.fullname" . }}-test-connection
  labels:
    {{- include "axiom.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: connection-test
      image: "{{ .Values.tests.image }}{{ with .Values.tests.digest }}@{{ . }}{{ end }}"
      {{- if or .Values.secrets.apiKey .Values.secrets.existingSecret }}
      env:
        - name: AXIOM_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "axiom.secretName" . }}
              key: AXIOM_API_KEY
              optional: true
      {{- end }}
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          base="http://{{ include "axiom.fullname" . }}:{{ .Values.service.port }}"
          # curl with the data-plane key when configured. /readyz is a public
          # ops endpoint and stays unauthenticated; /v1/models is guarded and
          # requires X-Axiom-Key when AXIOM_API_KEY is set on the server.
          curl_auth() {
            if [ -n "${AXIOM_API_KEY:-}" ]; then
              curl -H "X-Axiom-Key: $AXIOM_API_KEY" "$@"
            else
              curl "$@"
            fi
          }
          echo "[test] GET $base/readyz"
          curl -fsS --max-time 10 "$base/readyz" | grep -q '"status":"ready"'
          echo "[test] GET $base/v1/models"
          curl_auth -fsS --max-time 10 "$base/v1/models" | grep -q '"object"'
          echo "[test] OK"
{{- end }}
