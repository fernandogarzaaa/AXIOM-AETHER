apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "axiom.fullname" . }}
  labels:
    {{- include "axiom.labels" . | nindent 4 }}
data:
  AXIOM_HOST: "0.0.0.0"
  AXIOM_PORT: "8080"
  AXIOM_DEVICE: {{ .Values.config.device | quote }}
  RUST_LOG: {{ .Values.config.rustLog | quote }}
  AXIOM_MAX_CONTEXT_TOKENS: {{ .Values.config.maxContextTokens | quote }}
  AXIOM_PRODUCTION_BPE: {{ .Values.config.productionBpe | quote }}
  AXIOM_HEAL_MEMORY: {{ .Values.config.healMemoryPath | quote }}
  AXIOM_BPE_CKPT: "/app/checkpoints/axiom_production_bpe.bin"
  AXIOM_TOKENIZER: "/app/checkpoints/axiom_bpe.json"
  {{- with .Values.checkpoint.url }}
  AXIOM_CHECKPOINT_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.checkpoint.tokenizerUrl }}
  AXIOM_TOKENIZER_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.groundCorrect }}
  AXIOM_GROUND_CORRECT: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.adaptiveCompress }}
  AXIOM_ADAPTIVE_COMPRESS: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.verifyResponses }}
  AXIOM_VERIFY_RESPONSES: {{ . | quote }}
  {{- end }}
  {{- range $k, $v := .Values.config.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
