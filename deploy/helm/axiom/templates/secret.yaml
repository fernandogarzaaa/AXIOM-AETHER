{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "axiom.fullname" . }}
  labels:
    {{- include "axiom.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.fleetKey }}
  AXIOM_FLEET_KEY: {{ .Values.secrets.fleetKey | quote }}
  {{- end }}
  {{- if .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.secrets.contextApiKey }}
  AXIOM_CONTEXT_API_KEY: {{ .Values.secrets.contextApiKey | quote }}
  {{- end }}
{{- end }}
