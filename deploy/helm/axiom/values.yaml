# Default values for the Axiom-TTT Helm chart.
# Override with `-f my-values.yaml` or `--set key=value`.

replicaCount: 3

image:
  repository: ghcr.io/fernandogarzaaa/axiom-aether
  tag: latest
  # Pinned digest for the tag above, resolved 2026-11-09 from GHCR
  # (multi-arch manifest list). The chart renders repo:tag@digest when set.
  digest: "sha256:844f485adf925e515070a1680630eaefe4423a54ea8cbc971b045e6acb5d8afe"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Model weights — the image ships WITHOUT trained weights. Seed them at boot
# from object storage / a GitHub release. Leave URLs empty to boot with a
# random-initialized model (smoke deploys only; drift signals are weak).
# ---------------------------------------------------------------------------
checkpoint:
  url: ""          # -> AXIOM_CHECKPOINT_URL  (e.g. https://.../axiom_production_bpe.bin)
  tokenizerUrl: "" # -> AXIOM_TOKENIZER_URL   (e.g. https://.../axiom_bpe.json)
  # Pinned SHA-256 digests of the checkpoint and tokenizer, verified both at
  # fetch time and at server startup (see AXIOM_REQUIRE_VERIFIED_CHECKPOINT).
  # Leave empty for smoke deploys; pin both in production.
  sha256: ""          # -> AXIOM_CHECKPOINT_SHA256
  tokenizerSha256: "" # -> AXIOM_TOKENIZER_SHA256

# ---------------------------------------------------------------------------
# Runtime configuration (non-secret) — rendered into a ConfigMap.
# ---------------------------------------------------------------------------
config:
  device: cpu            # cpu | cuda
  rustLog: info
  maxContextTokens: "4096"
  productionBpe: "1"     # AXIOM_PRODUCTION_BPE — load the trained checkpoint dims from the sidecar
  # Refuse readiness until the production checkpoint is verified:
  # "1" makes /readyz return 503 unless the checkpoint file exists, its
  # tokenizer is present, and its SHA-256 matches checkpoint.sha256. When
  # checkpoint.tokenizerSha256 is pinned, the tokenizer file's SHA-256 must
  # match it too; without a pinned tokenizer hash the tokenizer is checked
  # for presence only.
  # Default "" (off) preserves the local-first default: the legacy bootstrap
  # model still reports ready. Set to "1" in production alongside a pinned
  # checkpoint.sha256; pinning the hash alone does NOT enable the gate.
  requireVerifiedCheckpoint: "" # AXIOM_REQUIRE_VERIFIED_CHECKPOINT
  # Grounding / compression feature flags (off unless set):
  groundCorrect: ""      # "1" to enable the self-correction loop
  adaptiveCompress: ""   # "1" to enable confidence-gated adaptive compression
  verifyResponses: ""    # "1" to auto-verify responses
  # Heal-memory path: an emptyDir so each pod learns locally, then the fleet
  # converges via the immunity gossip CronJob.
  healMemoryPath: /app/state/heal_memory.json
  extraEnv: {}           # arbitrary extra AXIOM_* env: { AXIOM_FOO: "bar" }

# ---------------------------------------------------------------------------
# Secrets — rendered into a Secret. Set these via --set or a sealed/external
# secret in production; NEVER commit real values.
# ---------------------------------------------------------------------------
secrets:
  # Shared fleet key — HMAC-signs immunity exports so peers verify before
  # trusting. STRONGLY recommended when gossip is enabled. Generate with
  # `openssl rand -hex 32`.
  fleetKey: ""
  # Data-plane API key — when set, the server requires `X-Axiom-Key` on every
  # data-plane route (/v1/*) and the gossip CronJob + `helm test` pod present
  # it. Generate with `openssl rand -hex 32`. Leave empty to keep the open
  # local-first default (the server guard is a passthrough when unset).
  # When set, app pods receive it via the Secret envFrom in deployment.yaml.
  apiKey: ""
  anthropicApiKey: ""
  contextApiKey: ""
  # If you already manage these in an existing Secret, set existingSecret to
  # its name and the chart will reference it instead of creating one.
  existingSecret: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  annotations: {}

# Headless service gives every pod a stable DNS A-record — the substrate the
# immunity gossip job uses to enumerate the fleet.
headlessService:
  enabled: true

# Prometheus scraping of /metrics (text/plain;version=0.0.4 exposition format).
# serviceMonitor requires the Prometheus Operator CRDs (monitoring.coreos.com/v1);
# leave disabled if you don't run them.
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    # Labels Prometheus selects ServiceMonitors by, e.g. {release: kube-prometheus-stack}.
    additionalLabels: {}
    # Namespace to create the ServiceMonitor in (defaults to the release namespace).
    namespace: ""

# ---------------------------------------------------------------------------
# Fleet convergence — a CronJob that pulls each pod's signed /v1/immunity
# export and fans it out to the others' /v1/immunity/merge. Anti-fragile:
# a fix any one node learns propagates to the whole fleet.
# ---------------------------------------------------------------------------
gossip:
  enabled: true
  schedule: "*/5 * * * *"        # every 5 minutes
  # Image needs curl + jq. Override if you mirror images internally.
  image: dwdraju/alpine-curl-jq:latest
  # Pinned digest for the image above, resolved 2026-11-09 from Docker Hub.
  digest: "sha256:eb00b3d4864c03814885a1c15ed1f5b2b569ca102ad4d02c27d582affb4fd6b1"
  backoffLimit: 1
  restartPolicy: Never

resources:
  requests:
    cpu: "500m"
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# State volume for heal memory / TTT session checkpoints. emptyDir is correct
# for the gossip-converged fleet model (per-pod local learning + gossip). Switch
# to a PVC only for a single-replica deployment.
persistence:
  type: emptyDir          # emptyDir | pvc
  size: 1Gi
  storageClass: ""

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

# Keep a quorum of pods serving during voluntary disruptions (node drains,
# rolling upgrades). Only rendered when there's more than one replica (a PDB on a
# single replica would block node drains entirely). Set maxUnavailable instead of
# minAvailable if you prefer; leave the other empty.
podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: ""

# `helm test <release>` connectivity smoke test (probes /readyz + /v1/models
# against the in-cluster Service). Image needs curl.
tests:
  enabled: true
  image: curlimages/curl:8.11.1
  # Pinned digest for the image above, resolved 2026-11-09 from Docker Hub.
  digest: "sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69"

# Probe timings — startupProbe covers model load + checkpoint download.
probes:
  startup:
    failureThreshold: 30   # 30 * 10s = up to 5 min for download + load
    periodSeconds: 10
  liveness:
    periodSeconds: 20
    failureThreshold: 3
  readiness:
    periodSeconds: 10
    failureThreshold: 3

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
