name: Publish packages

# Publish the `axiom` engine to crates.io (Rust) and PyPI (prebuilt wheels) when
# a version tag is pushed. Mirrors the targets release.yml already builds, so the
# same code that produces GitHub Release binaries produces the package-manager
# artifacts.
#
# One-time setup required (see docs/PUBLISHING.md):
#   * crates.io: configure Trusted Publishing for this repo + workflow (OIDC),
#     so no token is needed; the `crates-io` job requests an id-token below.
#   * PyPI: configure Trusted Publishing for this repo + workflow (OIDC), so no
#     token is needed; the `pypi` job requests an id-token below.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege by default; jobs widen only where strictly needed (the PyPI
# job requests id-token for Trusted Publishing).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  crates-io:
    name: Publish crate (crates.io)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # Trusted Publishing (OIDC) — no API token needed.
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev build-essential
      - name: Exchange OIDC token for crates.io publish token
        id: crates_auth
        # Trusted Publishing without third-party actions: fetch GitHub's OIDC
        # JWT, exchange it with crates.io for a short-lived publish token.
        # Requires the trusted publisher configured on crates.io for this
        # repo + workflow file, and id-token: write above.
        run: |
          set -euo pipefail
          oidc_resp=$(curl -sS --fail -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=crates.io")
          jwt=$(echo "$oidc_resp" | jq -r '.value')
          if [ -z "$jwt" ] || [ "$jwt" = "null" ]; then
            echo "::error::Failed to obtain OIDC JWT from GitHub"
            exit 1
          fi
          echo "::add-mask::$jwt"
          exchange_resp=$(curl -sS --fail -X POST https://crates.io/api/v1/trusted_publishing/tokens             -H "Content-Type: application/json"             -d "$(jq -n --arg jwt "$jwt" '{jwt: $jwt}')")
          token=$(echo "$exchange_resp" | jq -r '.token')
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::crates.io refused the OIDC exchange"
            echo "$exchange_resp" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: cargo publish
        working-directory: axiom_engine_rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_auth.outputs.token }}
        run: cargo publish --locked

  wheels:
    name: Build wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            maturin-target: x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            maturin-target: aarch64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            maturin-target: x64
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheel (prebuilt `axiom` binary)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: axiom_engine_rs
          target: ${{ matrix.maturin-target }}
          # Dev/training bins are gated behind the `tools` feature, so a default
          # build ships only the user-facing `axiom` (+ `axiom_engine` alias).
          args: --release --bindings bin --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.maturin-target }}
          path: axiom_engine_rs/dist/*.whl

  pypi:
    name: Publish to PyPI
    # Gate on crates.io too: a single tag is a multi-channel release, so don't
    # publish wheels to PyPI if the crate publish failed (avoids partial releases).
    needs: [wheels, crates-io]
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      contents: read
      id-token: write # Trusted Publishing (OIDC) — no API token needed.
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
