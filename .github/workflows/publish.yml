name: Publish packages

# Publish the `axiom` engine to crates.io (Rust) and PyPI (prebuilt wheels) when
# a version tag is pushed. Mirrors the targets release.yml already builds, so the
# same code that produces GitHub Release binaries produces the package-manager
# artifacts.
#
# One-time setup required (see docs/PUBLISHING.md):
#   * crates.io: set the CARGO_REGISTRY_TOKEN repo secret (crates.io API token).
#   * PyPI: configure Trusted Publishing for this repo + workflow (OIDC), so no
#     token is needed; the `pypi` job requests an id-token below.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least privilege by default; jobs widen only where strictly needed (the PyPI
# job requests id-token for Trusted Publishing).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  crates-io-mesh-core:
    name: Publish axiom_mesh_core (crates.io)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev build-essential
      - name: Check if axiom_mesh_core already published
        id: check
        run: |
          VERSION=$(grep '^version' axiom_mesh_core/Cargo.toml | head -1 | cut -d'"' -f2)
          if curl -sf "https://crates.io/api/v1/crates/axiom_mesh_core/$VERSION" > /dev/null; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "axiom_mesh_core $VERSION already on crates.io, skipping"
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi
      - name: cargo publish axiom_mesh_core
        if: steps.check.outputs.published != 'true'
        working-directory: axiom_mesh_core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  crates-io:
    name: Publish axiom_engine (crates.io)
    runs-on: ubuntu-22.04
    needs: crates-io-mesh-core
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev build-essential
      - name: Wait for axiom_mesh_core on crates.io
        run: |
          MESH_VERSION=$(grep 'axiom_mesh_core' axiom_engine_rs/Cargo.toml | grep -o 'version = "[^"]*"' | cut -d'"' -f2)
          echo "Waiting for axiom_mesh_core $MESH_VERSION on crates.io..."
          for i in $(seq 1 30); do
            if curl -sf "https://crates.io/api/v1/crates/axiom_mesh_core/$MESH_VERSION" > /dev/null; then
              echo "axiom_mesh_core $MESH_VERSION available"
              exit 0
            fi
            echo "Attempt $i/30: not yet available, waiting 20s..."
            sleep 20
          done
          echo "axiom_mesh_core $MESH_VERSION never appeared on crates.io"
          exit 1
      - name: cargo publish
        working-directory: axiom_engine_rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  wheels:
    name: Build wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            maturin-target: x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            maturin-target: aarch64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            maturin-target: x64
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build wheel (prebuilt `axiom` binary)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: axiom_engine_rs
          target: ${{ matrix.maturin-target }}
          # Dev/training bins are gated behind the `tools` feature, so a default
          # build ships only the user-facing `axiom` (+ `axiom_engine` alias).
          args: --release --bindings bin --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.maturin-target }}
          path: axiom_engine_rs/dist/*.whl

  pypi:
    name: Publish to PyPI
    # Gate on crates.io too: a single tag is a multi-channel release, so don't
    # publish wheels to PyPI if the crate publish failed (avoids partial releases).
    needs: [wheels, crates-io]
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      contents: read
      id-token: write # Trusted Publishing (OIDC) — no API token needed.
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
