name: CI

# Build + test gate for every pull request and for pushes to working branches.
# The existing release.yml only runs on version tags, so until now nothing
# verified a branch or PR before merge. This closes that gap.
on:
  pull_request:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: these jobs only read the repo. Individual jobs
# widen this if they need more (see docker-build).
permissions:
  contents: read

jobs:
  # AXIOM is the normative owner of CP/1 (see protocol/cp1/SPEC.md). EVE and
  # ADAM vendor the schema and fixture corpus and verify their copies against
  # MANIFEST.sha256, so an inconsistent normative source here desynchronizes
  # both of them. Every other job declares `needs: protocol` so this actually
  # gates them: jobs run in parallel regardless of their order in this file, so
  # without that dependency a failing protocol check would not stop anything.
  protocol:
    name: CP/1 normative source
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validator
        run: python -m pip install --quiet jsonschema

      # Verifies four independent properties: the manifest hashes match, every
      # fixture validates against the schema, every fixture is already in
      # canonical form with a correct content_hash, and every canonical type is
      # covered by at least one fixture.
      - name: Verify protocol consistency
        run: python3 protocol/cp1/tools/verify.py

      # The fixtures are generated. If regenerating them changes anything, the
      # committed corpus is stale and the vendored copies in EVE and ADAM are
      # pinned to bytes that no longer reflect the source.
      - name: Check fixtures are regenerated
        run: |
          python3 protocol/cp1/tools/build_fixtures.py
          if ! git diff --quiet -- protocol/cp1; then
            echo "::error::protocol/cp1 is not up to date; run tools/build_fixtures.py and commit the result"
            git diff --stat -- protocol/cp1
            exit 1
          fi

  # Phase 2 safety invariant: LOSSY_CONTEXT implies RECOVERY_CAPABILITY_PRESENT.
  # This job fails if any gate test is deleted or any gate call is removed
  # from the request paths. The invariant tests live in
  # axiom_engine_rs/tests/lossy_invariant.rs, a file feature work does not
  # touch. See docs/safety/lossy-invariant.md.
  lossy-invariant-guard:
    name: Lossy-context invariant guard
    needs: protocol
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify invariant test file exists with all gate tests
        run: |
          FILE="axiom_engine_rs/tests/lossy_invariant.rs"
          test -f "$FILE" || { echo "MISSING: $FILE"; exit 1; }
          for t in \
            invariant_digest_skipped_without_expand_tool \
            invariant_rebase_skipped_without_expand_tool \
            invariant_tool_deferral_skipped_on_bespoke_toolset \
            invariant_local_ack_labels_synthetic_answer \
            invariant_routing_downgrade_is_recorded \
            invariant_responses_apply_plan_fails_closed_on_length_mismatch; do
            grep -q "fn $t" "$FILE" || { echo "MISSING gate test: $t"; exit 1; }
          done
          echo "All 6 invariant gate tests present."

      - name: Verify gate calls survive in request paths
        run: |
          # The expand gate must be checked before digesting and before rebase.
          grep -q "expand_tool_available" axiom_engine_rs/src/digest.rs \
            || { echo "MISSING: expand_tool_available in digest.rs"; exit 1; }
          grep -q "crate::digest::expand_tool_available" axiom_engine_rs/src/server/routes_messages.rs \
            || { echo "MISSING: expand gate call in routes_messages.rs"; exit 1; }
          # Tool deferral must fail closed on zero working-set overlap.
          grep -q "has_working_set_overlap" axiom_engine_rs/src/server/routes_messages.rs \
            || { echo "MISSING: deferral fail-closed check in routes_messages.rs"; exit 1; }
          # Local-trivial must remain fail-closed (is_trivial gate).
          grep -q "crate::local_trivial::is_trivial" axiom_engine_rs/src/server/routes_messages.rs \
            || { echo "MISSING: local-trivial gate in routes_messages.rs"; exit 1; }
          # Model routing must keep its 4xx fallback.
          grep -q "model_rewritten_from" axiom_engine_rs/src/server/routes_messages.rs \
            || { echo "MISSING: routing fallback tracking in routes_messages.rs"; exit 1; }
          echo "All gate calls present in request paths."

  test:
    name: Build & test (Rust)
    # The protocol gate is cheap and its failure invalidates everything below.
    needs: protocol
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axiom_engine_rs/target
            axiom_mesh_rs/target
          key: ci-${{ runner.os }}-${{ hashFiles('axiom_engine_rs/Cargo.lock', 'axiom_mesh_rs/Cargo.lock') }}
          restore-keys: ci-${{ runner.os }}-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev build-essential

      - name: Format check (rustfmt, every crate graph)
        # The tree was formatted once (2026-10-29) to establish the baseline;
        # from here on an unformatted file fails CI. Each crate graph is its
        # own cargo project, so run the check in each.
        run: |
          (cd axiom_engine_rs && cargo fmt --check)
          (cd axiom_mesh_core && cargo fmt --check)
          (cd axiom_mesh_rs && cargo fmt --check)

      - name: Lint (clippy, all targets)
        working-directory: axiom_engine_rs
        # Deny warnings across the library, every bin (incl. the `tools`
        # binaries) and every test target, so bins and tests cannot rot while
        # the library stays clean.
        run: cargo clippy --locked --all-targets --features tools -- -D warnings

      - name: Build (release)
        working-directory: axiom_engine_rs
        run: cargo build --release --locked

      - name: Test
        working-directory: axiom_engine_rs
        run: cargo test --release --locked

      # The Axiom Mesh workspace is a sibling crate graph (axiom_prime and
      # axiom_mcp are not dependencies of the engine, so nothing here built
      # or tested them before). Cover its own build + test suite.
      - name: Test (Axiom Mesh workspace)
        working-directory: axiom_mesh_rs
        run: cargo test --release --locked

      # Canonical mesh crate: path dependency of the engine (replaces the
      # vendored src/mesh_core/). Its unit tests (incl. proptest suites) moved
      # here with the code, so run them explicitly. No --locked: the crate
      # ships no Cargo.lock (library convention); resolution happens fresh.
      - name: Test (axiom_mesh_core)
        working-directory: axiom_mesh_core
        run: cargo test --release

      - name: AxiomBench (deterministic pillars)
        working-directory: axiom_engine_rs
        run: cargo run --release --features tools --bin axiombench

      # Phase 4 item 1: the paired runner executes the smallest task
      # family end to end (arms A/D, single-file, one repeat, seed 42)
      # through the real `axiom solve` loop. The release solver binary
      # already exists by this step (Build (release) above); the results
      # JSON is git-ignored, like the pillars' JSON.
      # Phase 5 item 3: --fail-on-guardrail makes a guardrail FAIL (or
      # an arm with zero executed cells) fail the job; without it the
      # smoke run printed verdicts CI never enforced.
      - name: AxiomBench (paired smoke)
        working-directory: axiom_engine_rs
        run: cargo run --release --features tools --bin axiombench -- paired --smoke --fail-on-guardrail --out ../bench/results/paired-ci-smoke.json

      - name: End-to-end smoke (every pillar composes)
        run: ./scripts/demo_end_to_end.sh

  # Phase 3 item 4: graded session-concurrency stress harness
  # (axiom_engine_rs/tests/session_concurrency_stress.rs). The full `test`
  # job above already runs it, but this job runs it alone with --nocapture
  # so the measured baseline (p95 latency, RSS delta, registry size per
  # concurrency level) is visible in its own log, and so a stress-only
  # failure is diagnosable without digging through the whole suite.
  # The bounds it asserts are ratios against the level-1 baseline, not
  # absolute milliseconds: CI runners are not a perf lab.
  session-concurrency-stress:
    name: Session concurrency stress
    needs: protocol
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axiom_engine_rs/target
          key: ci-stress-${{ runner.os }}-${{ hashFiles('axiom_engine_rs/Cargo.lock') }}
          restore-keys: ci-stress-${{ runner.os }}-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev build-essential

      - name: Graded concurrency stress (p95 / RSS / registry bounds)
        working-directory: axiom_engine_rs
        run: cargo test --release --locked --test session_concurrency_stress -- --nocapture

  # ==== Phase 5 item 3: performance regression gate (BEGIN) ====
  # Delimited section so a sibling PR adding a different job to this file
  # merges cleanly: keep everything for this gate between the BEGIN/END
  # markers, including the --fail-on-guardrail flag on the paired smoke
  # step in the `test` job above (do not move that flag into this job;
  # it belongs to the smoke step the verdicts file specifies).
  #
  # Wires the Phase 3 stress harness (tests/stress.rs and
  # tests/session_concurrency_stress.rs) and the Phase 4 paired bench
  # (axiombench paired) into CI as a regression gate. The job:
  #   1. runs both stress tests (the graded one with --nocapture, saved
  #      to perf-stress.log for the comparison step),
  #   2. runs the paired smoke with --fail-on-guardrail, so a guardrail
  #      FAIL or an arm with zero executed cells fails the job,
  #   3. runs the demo-regression negative control, which MUST exit
  #      exactly 1 (guardrail failure, not a usage error or a crash)
  #      and whose fresh report must show arm D passing and
  #      D-regressed failing its reliability guardrail; a zero exit,
  #      any other exit, or a report without that verdict fails the job.
  #   4. compares the fresh numbers against the stored baseline
  #      (bench/results/perf-baseline.json) with
  #      scripts/check_perf_regression.py: exact on success counts,
  #      unsafe/rollback rates and guardrail verdicts; wide factors
  #      (3x paired wall time, 2x stress p95 growth capped at 20x)
  #      on wall-clock time, because CI runners are not a perf lab.
  #      Stress RSS delta is recorded but not compared across runs
  #      (allocator retention noise: two back-to-back sandbox runs
  #      measured a 3.5x spread at level 32); the graded test's own
  #      per-level RSS bound is the RSS gate. See
  #      docs/PERF-REGRESSION-GATE.md.
  # The full 40-cell paired matrix stays a manual release-time run:
  # the smoke matrix is what fits in a per-PR job.
  perf-regression:
    name: Performance regression gate
    needs: protocol
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axiom_engine_rs/target
          key: ci-perf-regression-${{ runner.os }}-${{ hashFiles('axiom_engine_rs/Cargo.lock') }}
          restore-keys: ci-perf-regression-${{ runner.os }}-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev build-essential

      - name: Build (release, tools)
        working-directory: axiom_engine_rs
        run: cargo build --release --locked --features tools

      - name: Stress (128 concurrent sessions)
        working-directory: axiom_engine_rs
        run: cargo test --release --locked --test stress

      - name: Graded concurrency stress (baseline log)
        working-directory: axiom_engine_rs
        run: |
          set -o pipefail
          cargo test --release --locked --test session_concurrency_stress -- --nocapture 2>&1 | tee ../perf-stress.log

      - name: Paired smoke (guardrail enforced)
        working-directory: axiom_engine_rs
        run: cargo run --release --features tools --bin axiombench -- paired --smoke --fail-on-guardrail --out ../bench/results/paired-ci-smoke.json

      - name: Demo-regression negative control (must fail the guardrail)
        working-directory: axiom_engine_rs
        run: |
          # A nonzero exit alone cannot pass this step: exit 2 is a
          # usage error and a crash before the guardrail runs also exits
          # nonzero, so require exactly exit 1 (guardrail failure) and
          # validate the fresh report: arm D passes and D-regressed
          # fails its reliability guardrail. The report is removed first
          # so a stale file from an earlier run can never stand in for
          # a fresh one.
          rm -f ../bench/results/paired-ci-demo.json
          if cargo run --release --features tools --bin axiombench -- paired --demo-regression --fail-on-guardrail --out ../bench/results/paired-ci-demo.json; then
            echo "::error::demo-regression exited 0: the regressed arm passed the guardrail, so the gate cannot trip"
            exit 1
          else
            status=$?
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::demo-regression exited $status, expected 1 (guardrail failure)"
            exit 1
          fi
          python3 -c 'import json, sys; d = json.load(open(sys.argv[1])); g = d["guardrails"]; assert g["D"]["pass"] is True, "arm D must pass in the demo run"; v = g["D-regressed"]; assert v["pass"] is False and any(r.startswith("reliability guardrail failed:") for r in v["reasons"]), "D-regressed must fail the reliability guardrail"' ../bench/results/paired-ci-demo.json
          echo "demo-regression exited 1 with D passing and D-regressed failing the reliability guardrail: the gate trips"

      - name: Compare against stored baseline
        run: python3 scripts/check_perf_regression.py --paired bench/results/paired-ci-smoke.json --stress-log perf-stress.log

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: perf-regression
          path: |
            bench/results/paired-ci-smoke.json
            bench/results/paired-ci-demo.json
            perf-stress.log
          if-no-files-found: warn
  # ==== Phase 5 item 3: performance regression gate (END) ====

  # The `experimental` feature (docs/EXPERIMENTAL.md) gates wired-but-unproven
  # subsystems out of the default build. The `test` job above already covers the
  # feature-OFF surface; this job keeps the feature-ON surface compiling and its
  # own tests passing, so gated code is demoted, not abandoned.
  experimental:
    name: Build & test (--features experimental)
    needs: protocol
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axiom_engine_rs/target
          key: ci-experimental-${{ runner.os }}-${{ hashFiles('axiom_engine_rs/Cargo.lock') }}
          restore-keys: ci-experimental-${{ runner.os }}-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev build-essential

      - name: Build (release, experimental)
        working-directory: axiom_engine_rs
        run: cargo build --release --locked --features experimental

      - name: Test (experimental)
        working-directory: axiom_engine_rs
        run: cargo test --release --locked --features experimental

  # Verify the crate builds and its unit tests pass on the Minimum Supported
  # Rust Version declared in axiom_engine_rs/Cargo.toml (rust-version =
  # "1.94", set by candle-core 0.11, which does not compile on 1.93 or older).
  # Pins the exact toolchain (not stable) and uses --locked so the committed
  # lockfile is proven MSRV-compatible. Scoped to the engine crate;
  # axiom_mesh_core declares its own, lower rust-version (1.90).
  msrv:
    name: MSRV (Rust 1.94)
    # The protocol gate is cheap and its failure invalidates everything below.
    needs: protocol
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust 1.94 toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94

      - name: Cache Cargo (MSRV)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axiom_engine_rs/target
          # Separate key from the stable-toolchain jobs: a shared target dir
          # across toolchains would cause needless rebuilds at best.
          key: ci-msrv-1.94-${{ runner.os }}-${{ hashFiles('axiom_engine_rs/Cargo.lock') }}
          restore-keys: ci-msrv-1.94-${{ runner.os }}-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev build-essential

      - name: Build (MSRV)
        working-directory: axiom_engine_rs
        run: cargo build --locked

      - name: Test (MSRV, library)
        working-directory: axiom_engine_rs
        run: cargo test --locked --lib

  # Validate the Docker image build on PRs. docker.yml only builds on pushes to
  # main / tags, so a broken Dockerfile (e.g. a missing build-context path) used
  # to escape review and only surface post-merge. This builds the image (no
  # push) so the release surface is gated before merge.
  docker-build:
    name: Docker image build (no push)
    # The protocol gate is cheap and its failure invalidates everything below.
    needs: protocol
    runs-on: ubuntu-22.04
    # Read the repo; read the Actions cache (buildx gha cache). No write scope.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (amd64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ci-docker
          cache-to: type=gha,mode=max,scope=ci-docker

  # Phase 2: every deployable image reference must carry a sha256 digest
  # pin. scripts/check-pinned-images.sh enforces it over values.yaml, the
  # chart templates, and the Dockerfile. It needs no network and no toolchain
  # beyond bash and python3, so it runs as its own cheap job.
  pinned-images:
    name: Pinned container images
    needs: protocol
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check every image reference is digest-pinned
        run: ./scripts/check-pinned-images.sh

  # The Python reference implementation in axiom_engine/ (published as the
  # `axiom-engine` PyPI package) ships its own PyTorch test suite that no job
  # used to run, so it could rot silently. Exercise it on CPU-only torch.
  python-reference:
    name: Python reference engine (tests)
    # The protocol gate is cheap and its failure invalidates everything below.
    needs: protocol
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install (CPU torch + package + dev deps)
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the job light and avoids the CUDA build; it
          # satisfies the `torch>=2.1` requirement so `-e .` won't re-pull it.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy
          pip install -e ".[server,dev]"

      - name: Pytest
        run: python -m pytest tests/ -q

  # Helm chart gate (audit Finding 6, P1): the gossip CronJob and `helm test`
  # pod must present X-Axiom-Key on data-plane probes when secrets.apiKey is
  # set, and keep working with no header when it is unset. `helm template`
  # renders are asserted by deploy/helm/axiom/tests/test_helm_auth.py.
  helm:
    name: Helm chart (lint + auth renders)
    # The protocol gate is cheap and its failure invalidates everything below.
    needs: protocol
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.22.1

      - name: Install PyYAML (render assertions)
        run: python -m pip install --quiet pyyaml

      - name: Helm lint
        run: helm lint deploy/helm/axiom

      - name: Helm auth renders (apiKey set / unset / existingSecret)
        run: python3 deploy/helm/axiom/tests/test_helm_auth.py

  # ===== BEGIN Phase 5 item 2: release gate (aggregate verdict) =====
  # One release-blocking verdict over the security and correctness
  # gates. Keep this whole block together: a sibling PR adding a
  # different job should append its own delimited block after the
  # END marker below, so the two PRs merge cleanly.
  #
  # Part 1 is `needs`: every other job in this workflow. Part 2 is
  # the script step: it reads the `needs` results, waits a bounded
  # time for required cross-workflow checks to finish, queries the
  # head commit check runs (which covers jobs from other workflows,
  # e.g. the agentic eval suite and the docker.yml multi-arch
  # publish), and reads the PR reviews. It fails when any gate is
  # red, and when a required cross-workflow check never ran.
  #
  # `if: ${{ !cancelled() }}` matters: without it, a failing needed
  # job would SKIP this job instead of failing it, so the PR would
  # show a skipped gate rather than a red verdict. With it, this job
  # always renders an explicit PASS or FAIL, except when the run
  # itself is cancelled.
  #
  # Limits, stated plainly. A green verdict here means every
  # EVALUATED gate passed. One gate has no per-run evidence yet
  # (provenance: no CI check run proves it on a push or PR; the
  # evidence is the release attestation, verified at release time)
  # and still blocks a release; the local mirror
  # scripts/release_gate.py reports it NOT_EVALUATED and exits 1.
  # See docs/RELEASE-GATES.md. The script step also writes it into
  # the job summary so the gap is visible in the PR UI, not buried
  # in the log.
  release-gate:
    name: Release gate (aggregate verdict)
    needs:
      - protocol
      - lossy-invariant-guard
      - test
      - session-concurrency-stress
      - perf-regression
      - experimental
      - msrv
      - docker-build
      - pinned-images
      - python-reference
      - helm
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - name: Aggregate verdict (needs + cross-workflow checks + reviews)
        uses: actions/github-script@v8
        with:
          script: |
            const SELF = "Release gate (aggregate verdict)";
            const REVIEW_BOTS = ["coderabbitai[bot]", "chatgpt-codex-connector[bot]"];
            // Cross-workflow checks mapped to gates. `null` means
            // informational: it never fails the gate. Mirrors
            // scripts/release_gate.py. Checks absent from this ref are
            // skipped, not failed: docker.yml only runs on pushes to
            // main and tags, so its three checks never exist on a PR
            // head. A present red one fails its gate. Checks with no
            // entry here are skipped, not failed: this workflow's own
            // jobs are covered by `needs` below, and a sibling run for
            // the same head must not fail this gate through them.
            const MAPPED = {
              "Agentic eval suite": "full-tests",
              "Build linux/amd64": "docker-build",
              "Build linux/arm64": "docker-build",
              "Merge into multi-arch manifest": "docker-build",
              "Regenerate proof-loop metrics": null,
              "CodeRabbit": null,
            };
            // Required cross-workflow checks: the gate must see them,
            // not just see no failure. "Agentic eval suite" is
            // required only where eval.yml runs: every pull request,
            // pushes to main and claude/**, and a manual dispatch on
            // one of those refs. A standalone CI dispatch on any other
            // branch never schedules eval.yml, so requiring its check
            // there waits the bounded 10 minutes and then fails on a
            // check that was never scheduled. The docker multi-arch
            // checks are required only on refs that schedule
            // docker.yml: pushes to main and v* tags, and a manual
            // dispatch on one of those refs. The local mirror enforces
            // the same rules.
            const REQUIRED_CROSS = [];
            const EVAL_REF =
              context.ref === "refs/heads/main" ||
              context.ref.startsWith("refs/heads/claude/");
            if (context.eventName === "pull_request" || EVAL_REF) {
              REQUIRED_CROSS.push("Agentic eval suite");
            }
            const DOCKER_REF =
              context.ref === "refs/heads/main" ||
              context.ref.startsWith("refs/tags/v");
            if (DOCKER_REF && context.eventName !== "pull_request") {
              REQUIRED_CROSS.push("Build linux/amd64", "Build linux/arm64", "Merge into multi-arch manifest");
            }
            // Third-party app checks conclude skipped/neutral when the
            // app takes no action (e.g. CodeRabbit skips a PR). Those
            // are informational by definition, never a gate failure.
            // Required checks are exempt: only completed/success
            // passes for them.
            const BENIGN = new Set(["skipped", "neutral"]);
            const failures = [];

            // Part 1: every needed job in this workflow must succeed.
            // A needed job that failed makes the others skipped, and a
            // skipped job is an unevaluated gate, not a pass.
            const needsCtx = ${{ toJSON(needs) }};
            for (const [job, ctx] of Object.entries(needsCtx)) {
              if (ctx.result !== "success") {
                failures.push(`needs.${job}: ${ctx.result}`);
              }
            }

            // Part 2: cross-workflow check runs on the head SHA. On a
            // PR, context.sha is the merge commit; the runs live under
            // the PR head SHA, so resolve the ref explicitly.
            const ref = context.eventName === "pull_request"
              ? context.payload.pull_request.head.sha
              : context.sha;
            // The gate runs when the ci.yml jobs finish, but the other
            // workflows run on their own schedule: a required
            // cross-workflow check can still be running when this job
            // first queries it. Wait for it, bounded (20 x 30s), so
            // the verdict fails on a real red gate, not on timing.
            // After the wait the verdict still fails closed on a
            // missing or unfinished required check.
            let latest = new Map();
            for (let attempt = 0; attempt < 20; attempt++) {
              const { data: runs } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref,
                per_page: 100,
              });
              // listForRef returns every run for the ref, including
              // superseded re-runs. Keep the newest run per name.
              latest = new Map();
              for (const run of runs.check_runs) {
                if (!latest.has(run.name) || run.id > latest.get(run.name).id) {
                  latest.set(run.name, run);
                }
              }
              const pending = REQUIRED_CROSS.filter((name) => {
                const run = latest.get(name);
                return !run || run.status !== "completed";
              });
              if (!pending.length) break;
              core.info(`Waiting for cross-workflow checks: ${pending.join(", ")} (attempt ${attempt + 1}/20)`);
              await new Promise((resolve) => setTimeout(resolve, 30000));
            }
            for (const name of REQUIRED_CROSS) {
              if (!latest.has(name)) {
                failures.push(`${name} [${MAPPED[name]}]: missing (required cross-workflow check never ran on this ref)`);
              }
            }
            for (const run of latest.values()) {
              if (run.name === SELF) continue;
              // Only explicitly mapped cross-workflow checks can fail
              // the gate here. Unmapped checks are skipped: this
              // workflow's own jobs are already covered by `needs`
              // above, and a push-triggered sibling run for the same
              // head schedules the same jobs under a different
              // concurrency group, so its unfinished runs must not
              // fail this gate.
              if (!(run.name in MAPPED)) continue;
              const mapped = MAPPED[run.name];
              if (mapped === null) continue;
              if (!REQUIRED_CROSS.includes(run.name) && BENIGN.has(run.conclusion)) continue;
              if (run.status !== "completed" || run.conclusion !== "success") {
                failures.push(`${run.name} [${mapped}]: ${run.status}/${run.conclusion}`);
              }
            }

            // Part 3: the review gate bites on pull requests only. A
            // review that only comments still counts as present.
            let reviewNote = "Review gate skipped: no PR on this event";
            if (context.eventName === "pull_request") {
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              });
              const botSeen = reviews.some(r => REVIEW_BOTS.includes(r.user.login));
              const approved = reviews.some(r => r.state === "APPROVED");
              if (!botSeen && !approved) {
                failures.push("review gate: no CodeRabbit, Codex, or approving human review on this PR");
              } else {
                reviewNote = `Review gate PASS (bot review: ${botSeen}, approved: ${approved})`;
              }
            }

            const notEvaluated = "provenance is NOT_EVALUATED by this job and still blocks a release; see docs/RELEASE-GATES.md.";
            if (failures.length) {
              await core.summary
                .addHeading("Release gate: FAIL")
                .addList(failures)
                .addRaw(`\n${notEvaluated}`)
                .write();
              core.setFailed(`Release gate FAIL: ${failures.join("; ")}`);
              return;
            }
            await core.summary
              .addHeading("Release gate: PASS (evaluated gates only)")
              .addRaw(`\n${reviewNote}\n\n${notEvaluated}`)
              .write();
            core.info(`Release gate PASS: all evaluated CI gates green. ${reviewNote} ${notEvaluated}`);
  # ===== END Phase 5 item 2: release gate =====
