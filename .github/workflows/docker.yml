# Docker workflow — builds and publishes a multi-architecture image to the
# GitHub Container Registry (ghcr.io) on every push to main and on version tags.
#
# Image: ghcr.io/fernandogarzaaa/axiom-aether
# Platforms: linux/amd64 + linux/arm64 (arm64 enables OCI Ampere / Graviton / Apple
# silicon). Each arch builds on a NATIVE runner (no QEMU emulation), pushes by
# digest, and a final job stitches the digests into one multi-arch manifest list.

name: Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # normalized to lowercase per-job (GHCR requires it)

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm   # GitHub-hosted native ARM runner (free for public repos)

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # GHCR refs must be lowercase; github.repository preserves the repo's
      # original casing (AXIOM-AETHER), so normalize it before any image ref.
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Sanitize platform name
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Native attestations: an SPDX SBOM and SLSA provenance are
          # attached to each pushed image in the registry.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge into multi-arch manifest
    runs-on: ubuntu-22.04
    needs: [build]
    permissions:
      # contents: write is needed by the release-asset upload step on
      # tag runs (softprops/action-gh-release requires it).
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.32.0

      - name: Extract Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      # Repo-side attestation for the pushed multi-arch manifest. The
      # manifest digest is the SHA-256 of the raw manifest bytes, so
      # it is computed here rather than trusted from a log line. The
      # image SBOM comes from syft against the pushed image; the
      # provenance file records the source commit, builder, and build
      # inputs. Both are workflow artifacts on every run, and release
      # assets on tag runs, where a release exists to attach them to.
      - name: Generate image SBOM and provenance
        run: |
          set -euo pipefail
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          DIGEST="sha256:$(docker buildx imagetools inspect "$IMAGE" --raw | sha256sum | cut -d' ' -f1)"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"
          python3 scripts/generate_attestation.py attest-image \
            --image "$IMAGE" --digest "$DIGEST" --out image.provenance.json
          "${{ steps.syft.outputs.cmd }}" "$IMAGE" -o "spdx-json=image.sbom.syft.json"
          python3 -c "import json; d=json.load(open('image.sbom.syft.json')); assert d['spdxVersion'].startswith('SPDX-'), 'syft output has no SPDX version'; print(f\"syft SBOM: {d['spdxVersion']}, {len(d.get('packages', []))} packages\")"

      - name: Upload image attestation artifacts
        uses: actions/upload-artifact@v7
        with:
          name: image-attestation-${{ steps.meta.outputs.version }}
          path: |
            image.provenance.json
            image.sbom.syft.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload image attestation to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            image.provenance.json
            image.sbom.syft.json
          fail_on_unmatched_files: true
