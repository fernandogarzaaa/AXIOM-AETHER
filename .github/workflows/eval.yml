name: Agentic Eval

# Runs the built-in autonomous-repair eval on every PR and every push to a
# working branch. `axiom eval-agentic` materializes a set of seeded broken-repo
# fixtures, drives the real localize -> deterministic Poly-JIT repair -> verify
# loop on each (all offline, no model or network), and exits non-zero unless it
# drives every fixture green. ci.yml already runs `cargo test`, which covers the
# eval harness's unit tests; this job exercises the end-to-end subcommand as a
# capability gate, which nothing else did.
on:
  pull_request:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval-agentic:
    name: Agentic eval suite
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axiom_engine_rs/target
          key: eval-${{ runner.os }}-${{ hashFiles('axiom_engine_rs/Cargo.lock') }}
          restore-keys: eval-${{ runner.os }}-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev build-essential

      - name: Build axiom binary
        working-directory: axiom_engine_rs
        run: cargo build --release --locked --bin axiom

      # The real-interpreter fixtures need these on PATH; ubuntu-22.04 ships
      # all of them (rustc comes from the toolchain step). Print the versions
      # so a skip or a failure can be read against the exact toolchain.
      - name: Toolchains for the real-interpreter fixtures
        run: |
          python3 --version
          node --version
          go version
          rustc --version
          gcc --version | head -1
          ruby --version

      # --require-all: a fixture skipped for a missing toolchain fails the run,
      # so this job proves the whole suite executed, not just the subset the
      # runner happened to support.
      - name: Run agentic eval (deterministic offline fixtures)
        working-directory: axiom_engine_rs
        run: cargo run --release --locked --bin axiom -- eval-agentic --require-all
        env:
          RUST_LOG: info
          AXIOM_DEVICE: cpu

      # The on-disk corpus (bench/repair/, docs/BENCH-REPAIR.md) exercises the
      # real `axiom solve` CLI from a fresh checkout of each fixture: no-op
      # baseline must fail, the repair must land, a failed attempt must leave
      # the tree byte-identical. Same binary as above, so no extra build.
      - name: Run on-disk repair corpus (scripts/bench_repair.sh --check)
        run: scripts/bench_repair.sh --check
        env:
          AXIOM_DEVICE: cpu
          AXIOM_EVAL_REQUIRE_ALL: "1"

      - name: Upload repair-corpus table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-corpus-${{ github.sha }}
          path: bench/results/repair-*.md
          if-no-files-found: warn
          retention-days: 90
