name: Proof Loop

# Regenerates AXIOM's three headline metrics (docs/PROOF-LOOP.md) on every push
# to main and every PR, uploads the table as an artifact, and fails if the
# autonomous-repair gate drops below 100%. Between releases this is how metric
# drift becomes visible without waiting for a tag.
on:
  pull_request:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: proof-loop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proof-loop:
    name: Regenerate proof-loop metrics
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axiom_engine_rs/target
          key: proof-loop-${{ runner.os }}-${{ hashFiles('axiom_engine_rs/Cargo.lock') }}
          restore-keys: proof-loop-${{ runner.os }}-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev build-essential

      - name: Run the proof loop (gates on autonomous repair)
        run: bash scripts/proof_loop.sh --check

      - name: Upload proof-loop table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-loop-${{ github.sha }}
          path: bench/results/proof-loop-*.md
          if-no-files-found: warn
          retention-days: 90
