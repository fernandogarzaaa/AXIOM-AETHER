name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish (e.g. v0.1.1). The release + tag are created at the selected ref."
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: axiom_engine
  # On a tag push this is the tag; on manual dispatch it's the provided input.
  VERSION: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Cross-platform release binaries (linux-x86_64 + windows-x86_64), each
  # packaged as axiom-ttt-{version}-{platform}.tar.gz and uploaded as an
  # artifact for the final release job to attach.
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axiom_engine_rs/target
          key: build-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('axiom_engine_rs/Cargo.lock') }}
          restore-keys: build-${{ runner.os }}-${{ matrix.target }}-

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev build-essential

      - name: Build release binary
        working-directory: axiom_engine_rs
        run: cargo build --release --locked --bin ${{ env.BINARY_NAME }} --target ${{ matrix.target }}

      # tar.gz for every platform (requirement c). Windows runners ship bsdtar
      # as `tar`, so this works identically under bash on all three OSes.
      - name: Package tar.gz
        shell: bash
        run: |
          set -euo pipefail
          staging="axiom-ttt-${VERSION}-${{ matrix.suffix }}"
          mkdir -p "$staging"
          bin="axiom_engine_rs/target/${{ matrix.target }}/release/${BINARY_NAME}"
          [ -f "${bin}.exe" ] && cp "${bin}.exe" "$staging/" || cp "$bin" "$staging/"
          cp README.md "$staging/" 2>/dev/null || true
          cp LICENSE "$staging/" 2>/dev/null || true
          tar -czf "${staging}.tar.gz" "$staging"
          echo "Packaged ${staging}.tar.gz"

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.suffix }}
          path: axiom-ttt-${{ env.VERSION }}-${{ matrix.suffix }}.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Train + publish only the BPE tokenizer (checkpoints/axiom_bpe.json). It is
  # small, deterministic, and trains offline from the repo's own sources in
  # seconds. The semantic .bin checkpoint is far too large for a GitHub release
  # asset, so it is intentionally NOT published here — users train it locally
  # (see the release notes / README "Build the semantic model" step).
  # ---------------------------------------------------------------------------
  tokenizer:
    name: Build & publish BPE tokenizer
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axiom_engine_rs/target
          key: tok-${{ runner.os }}-${{ hashFiles('axiom_engine_rs/Cargo.lock') }}
          restore-keys: tok-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev build-essential

      - name: Build tokenizer trainer
        working-directory: axiom_engine_rs
        run: cargo build --release --locked --bin train_tokenizer

      - name: Train BPE tokenizer (offline, from repo sources)
        run: |
          set -euo pipefail
          # No crawled corpus in CI → train_tokenizer falls back to the repo's
          # own .rs sources, producing a deterministic checkpoints/axiom_bpe.json.
          AXIOM_BPE_VOCAB=16000 ./axiom_engine_rs/target/release/train_tokenizer
          ls -l checkpoints/axiom_bpe.json

      - name: Upload tokenizer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tokenizer
          path: checkpoints/axiom_bpe.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Collect all artifacts and publish the GitHub release with a body that
  # explains why the .bin is absent and how to produce it locally.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: [build, tokenizer]
    runs-on: ubuntu-22.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten assets
        run: |
          set -euo pipefail
          mkdir -p assets
          find dist -type f \( -name '*.tar.gz' -o -name 'axiom_bpe.json' \) -exec cp {} assets/ \;
          ls -l assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: AXIOM-AETHER ${{ env.VERSION }}
          fail_on_unmatched_files: true
          files: |
            assets/axiom-ttt-${{ env.VERSION }}-linux-x86_64.tar.gz
            assets/axiom-ttt-${{ env.VERSION }}-windows-x86_64.tar.gz
            assets/axiom_bpe.json
          body: |
            ## AXIOM-AETHER ${{ env.VERSION }}

            An inference engine that learns from its environment — online
            Test-Time Training, self-healing runtime, autonomous repair, and
            hallucination grounding, as a drop-in proxy for any LLM.

            ### Assets
            - `axiom-ttt-${{ env.VERSION }}-linux-x86_64.tar.gz` — Linux x86-64 binary
            - `axiom-ttt-${{ env.VERSION }}-windows-x86_64.tar.gz` — Windows x86-64 binary
            - `axiom_bpe.json` — the trained ByteLevel-BPE tokenizer (vocab 16,000)

            ### Note on the model checkpoint
            The trained semantic checkpoint (`axiom_production_bpe.bin`) is **not**
            attached: it is too large for a GitHub release asset. Train it locally
            (offline, no network) in a few minutes:

            ```bash
            cd axiom_engine_rs
            cargo build --release --bin corpus_crawl --bin train_tokenizer --bin train_semantic --bin eval_model
            AXIOM_CORPUS_MAX_MB=150 ./target/release/corpus_crawl
            AXIOM_BPE_VOCAB=16000 ./target/release/train_tokenizer
            AXIOM_TTT_STABILIZE=1 ./target/release/train_semantic   # writes checkpoints/axiom_production_bpe.bin
            ./target/release/eval_model                              # acceptance + drift gate
            ```

            See the README section **"Build the semantic model"** for details and
            tuning knobs (`AXIOM_DMODEL`, `AXIOM_EPOCHS`, `AXIOM_LR`, …).
