name: Release Binaries

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: axiom_engine

permissions:
  contents: write

jobs:
  test:
    name: Test Rust workspace
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axiom_engine_rs/target
          key: test-${{ runner.os }}-${{ hashFiles('axiom_engine_rs/Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev build-essential

      - name: Run tests
        working-directory: axiom_engine_rs
        run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            ext: tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
            ext: zip
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: macos-arm64
            ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axiom_engine_rs/target
          key: build-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('axiom_engine_rs/Cargo.lock') }}
          restore-keys: build-${{ runner.os }}-${{ matrix.target }}-

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev build-essential

      - name: Build release binary
        working-directory: axiom_engine_rs
        run: cargo build --release --locked --bin ${{ env.BINARY_NAME }} --target ${{ matrix.target }}

      - name: Package Unix archive
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          staging="axiom-ttt-${{ github.ref_name }}-${{ matrix.suffix }}"
          mkdir -p "$staging"
          cp "axiom_engine_rs/target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}" "$staging/"
          cp README.md "$staging/"
          cp LICENSE "$staging/" 2>/dev/null || true
          tar -czf "${staging}.tar.gz" "$staging"
          echo "ASSET=${staging}.tar.gz" >> "$GITHUB_ENV"

      - name: Package Windows archive
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $staging = "axiom-ttt-${{ github.ref_name }}-${{ matrix.suffix }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "axiom_engine_rs\target\${{ matrix.target }}\release\${{ env.BINARY_NAME }}.exe" $staging\
          Copy-Item README.md $staging\
          if (Test-Path LICENSE) { Copy-Item LICENSE $staging\ }
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          "ASSET=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true
