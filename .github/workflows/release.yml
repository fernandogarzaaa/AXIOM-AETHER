name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/publish (e.g. v0.1.1). The release + tag are created at the selected ref."
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: axiom_engine
  # On a tag push this is the tag; on manual dispatch it's the provided input.
  VERSION: ${{ github.event.inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  test:
    name: Test Rust workspace
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axiom_engine_rs/target
          key: test-${{ runner.os }}-${{ hashFiles('axiom_engine_rs/Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev build-essential

      - name: Run tests
        working-directory: axiom_engine_rs
        run: cargo test --locked

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            ext: tar.gz
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
            ext: zip
          - os: macos-14
            target: aarch64-apple-darwin
            suffix: macos-arm64
            ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axiom_engine_rs/target
          key: build-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('axiom_engine_rs/Cargo.lock') }}
          restore-keys: build-${{ runner.os }}-${{ matrix.target }}-

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev build-essential

      - name: Build release binary
        working-directory: axiom_engine_rs
        run: cargo build --release --locked --bin ${{ env.BINARY_NAME }} --target ${{ matrix.target }}

      - name: Package Unix archive
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          staging="axiom-ttt-${{ env.VERSION }}-${{ matrix.suffix }}"
          mkdir -p "$staging"
          cp "axiom_engine_rs/target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}" "$staging/"
          cp README.md "$staging/"
          cp LICENSE "$staging/" 2>/dev/null || true
          tar -czf "${staging}.tar.gz" "$staging"
          echo "ASSET=${staging}.tar.gz" >> "$GITHUB_ENV"

      - name: Package Windows archive
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $staging = "axiom-ttt-${{ env.VERSION }}-${{ matrix.suffix }}"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item "axiom_engine_rs\target\${{ matrix.target }}\release\${{ env.BINARY_NAME }}.exe" $staging\
          Copy-Item README.md $staging\
          if (Test-Path LICENSE) { Copy-Item LICENSE $staging\ }
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"
          "ASSET=$staging.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true

  checkpoint:
    name: Train & publish production checkpoint
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            axiom_engine_rs/target
          key: ckpt-${{ runner.os }}-${{ hashFiles('axiom_engine_rs/Cargo.lock') }}
          restore-keys: ckpt-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev build-essential python3

      # Trains the d128/2L checkpoint on the repo's own corpus and runs the
      # acceptance eval. The script exits non-zero unless clean-vs-anomaly
      # separation PASSes, so a bad checkpoint never reaches a release.
      - name: Train + validate checkpoint
        run: ./scripts/train_cpu_quickstart.sh

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p ckpt_release
          cp checkpoints/axiom_production_bpe.bin       ckpt_release/
          cp checkpoints/axiom_production_bpe.meta.json ckpt_release/
          cp checkpoints/axiom_bpe.json                 ckpt_release/
          cp checkpoints/axiom_drift_gate.txt           ckpt_release/
          sha256sum ckpt_release/* > ckpt_release/SHA256SUMS.txt
          cat ckpt_release/SHA256SUMS.txt

      # Stable, tag-independent asset names so Helm's checkpoint.url can point
      # at releases/latest/download/<file>.
      - name: Upload checkpoint assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            ckpt_release/axiom_production_bpe.bin
            ckpt_release/axiom_production_bpe.meta.json
            ckpt_release/axiom_bpe.json
            ckpt_release/axiom_drift_gate.txt
            ckpt_release/SHA256SUMS.txt
          fail_on_unmatched_files: true
