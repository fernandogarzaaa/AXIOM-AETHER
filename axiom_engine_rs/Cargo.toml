[package]
name = "axiom_engine"
version = "0.4.1"
edition = "2021"
description = "Axiom-TTT Inference Engine â€“ Rust implementation using candle"
license = "MIT"
repository = "https://github.com/fernandogarzaaa/AXIOM-AETHER"
homepage = "https://github.com/fernandogarzaaa/AXIOM-AETHER"
readme = "README.md"
authors = ["Fernando Garza <fernandogarzaaa@users.noreply.github.com>"]
keywords = ["ttt", "inference", "llm", "self-healing", "cli"]
categories = ["command-line-utilities", "science"]
# `axiom` is the canonical entrypoint (so `cargo run` and maturin's bin wheel
# select it rather than ambiguating over the many dev/bench binaries).
default-run = "axiom"
# Keep the published crate to source only â€” never ship checkpoints, models, or
# build output (crates.io enforces a size limit these would blow past).
exclude = [
    "target/*",
    "target-*/*",
    "dist/*",
    "checkpoints/*",
    "**/*.safetensors",
    "**/*.gguf",
    "tests/fixtures/*",
]

# Two names for the same entrypoint: `axiom_engine` keeps the existing Docker /
# release / script references working, while `axiom` is the clean command that
# `cargo install` and the pip wheel expose (matching what install.sh already
# renames the release binary to).
[[bin]]
name = "axiom_engine"
path = "src/main.rs"

[[bin]]
name = "axiom"
path = "src/bin/axiom.rs"

[features]
default = []
# Enable NVIDIA CUDA GPU backend (requires CUDA toolkit).
cuda = ["candle-core/cuda", "candle-nn/cuda"]
# Enable Apple Metal GPU backend (macOS / Apple Silicon only).
metal = ["candle-core/metal", "candle-nn/metal"]
# Dev/training/eval binaries (src/bin/*). Off by default so `cargo install`,
# the pip wheel, Docker, and release builds ship only the user-facing `axiom`
# command â€” not the training toolchain. Build them with `--features tools`.
tools = []
# S5 (CVM cost stack) behavior eval gate: tests/cvm_eval.rs drives real
# `claude -p` traffic through a live local proxy and bills the operator's
# own Anthropic account. Off by default -- run explicitly via
# `cargo test --features live-eval --test cvm_eval` (see scripts/cvm_eval.sh).
live-eval = []
# Experimental subsystems that are wired but not covered by the proof loop
# (docs/EXPERIMENTAL.md). Off by default so `cargo install`, the pip wheel,
# Docker, and release builds ship only the proven surface. Stage 1 gates the
# ChimeraLang DSL (`axiom chimera`, `POST /v1/chimera/run`).
experimental = []
# Fuzzy (near-duplicate) dedup tier -- extends S4's exact-byte dedup with a
# small pretrained static-embedding similarity oracle (src/fuzzy_dedup.rs).
# Off by default: adds an external model dependency and, like S4 before it,
# needs a real-traffic measurement pass and its own eval gate before any
# default flips to on. See docs/EXPERIMENTAL.md.
fuzzy-embed = ["dep:model2vec-rs", "dep:anyhow"]
# GPU-first tier on top of fuzzy-embed: tries a larger contextual model
# (bge-base, ~109M params, fits a 2GB VRAM budget -- see src/gpu_embed.rs)
# on CUDA when the `cuda` feature is also enabled, otherwise the same model
# on CPU, then falls back further to fuzzy-embed's small Model2Vec model
# (crate::fuzzy_dedup::AutoBackend implements the full cascade). Does NOT
# imply `cuda` so machines without a CUDA toolkit can still compile and run
# CPU-only (`--features fuzzy-embed-gpu` alone); add `,cuda` explicitly for
# GPU acceleration (requires nvcc / CUDA toolkit).
fuzzy-embed-gpu = ["dep:candle-transformers", "dep:hf-hub", "fuzzy-embed"]

# Dev/training/eval binaries, gated behind the `tools` feature (see above).
[[bin]]
name = "axiombench"
path = "src/bin/axiombench/main.rs"
required-features = ["tools"]

[[bin]]
name = "build_pairs"
path = "src/bin/build_pairs.rs"
required-features = ["tools"]

[[bin]]
name = "corpus_crawl"
path = "src/bin/corpus_crawl.rs"
required-features = ["tools"]

[[bin]]
name = "eval_model"
path = "src/bin/eval_model.rs"
required-features = ["tools"]

[[bin]]
name = "eval_recall"
path = "src/bin/eval_recall.rs"
required-features = ["tools"]

[[bin]]
name = "harvest"
path = "src/bin/harvest.rs"
required-features = ["tools"]

[[bin]]
name = "search_node"
path = "src/bin/search_node.rs"
required-features = ["tools"]

[[bin]]
name = "smoke_embed"
path = "src/bin/smoke_embed.rs"
required-features = ["tools"]

[[bin]]
name = "train_embedder"
path = "src/bin/train_embedder.rs"
required-features = ["tools"]

[[bin]]
name = "train_semantic"
path = "src/bin/train_semantic.rs"
required-features = ["tools"]

[[bin]]
name = "train_tokenizer"
path = "src/bin/train_tokenizer.rs"
required-features = ["tools"]

# S5 (CVM cost stack) behavior eval gate, gated behind the `live-eval`
# feature (see above) -- `cargo test` never discovers or compiles it by
# default, only `cargo test --features live-eval --test cvm_eval`.
[[test]]
name = "cvm_eval"
path = "tests/cvm_eval.rs"
required-features = ["live-eval"]

[dependencies]
candle-core = "0.10.2"
candle-nn = "0.10.2"
tokio = { version = "1.35", features = ["full"] }
sha2 = "0.10.8"
rand = "0.8.5"
axiom_core = { path = "../axiom_mesh_rs/axiom_core" }
ndarray = "0.16"
indicatif = "0.17.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokenizers = "0.15"
scraper = "0.27"
tree-sitter = "0.26.9"
tree-sitter-rust = "0.24.2"
urlencoding = "2.1"
bincode = "1.3"
axum = { version = "0.7", features = ["json", "ws"] }
# WS client for the /v1/responses WebSocket passthrough (Codex's preferred transport).
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
tower-http = { version = "0.5", features = ["cors", "trace", "decompression-full"] }
tower-lsp = "0.20"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
safetensors = "0.7.0"
dashmap = "5.5"
walkdir = "2.5"
clap = { version = "4.6.1", features = ["derive"] }
toml = "1.1.2"
dirs = "6.0.0"
ratatui = "0.29"
crossterm = "0.28"
# Fuzzy dedup tier (src/fuzzy_dedup.rs): extends S4 prefix_diet from
# byte-identical dedup to near-duplicate dedup via a small, pretrained,
# externally-distilled static embedding model used only as a similarity
# oracle -- never for generation. Both optional so default builds
# (`cargo install`, the pip wheel, Docker, release binaries) carry no
# dependency on an external model. Enable with `--features fuzzy-embed`.
# See docs/EXPERIMENTAL.md.
model2vec-rs = { version = "0.1", optional = true }
anyhow = { version = "1", optional = true }
# GPU-first fuzzy-dedup backend (src/gpu_embed.rs): a larger, pretrained
# contextual encoder (BAAI/bge-base-en-v1.5) used purely as a similarity
# oracle, sized to fit a 2GB VRAM budget. Pinned to 0.10.2 to match this
# crate's existing candle-core/candle-nn = "0.10.2" pins exactly, rather than
# crates.io's newer 0.11.0, so enabling this feature never forces a candle
# upgrade across the rest of the engine. hf-hub fetches config/tokenizer/
# weights from the Hub (no bundled checkpoint, same convention as the rest
# of this file's `exclude` list).
candle-transformers = { version = "0.10.2", optional = true }
hf-hub = { version = "0.4", optional = true }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
